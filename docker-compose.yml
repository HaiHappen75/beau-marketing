# Local development database only. Production Postgres is a Coolify resource.
services:
  postgres:
    image: postgres:16-alpine
    container_name: beau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beau
      POSTGRES_PASSWORD: beau
      POSTGRES_DB: beau_marketing
    ports:
      # Host port 5436 on purpose, not a typo: every project has its own fixed local
      # Postgres port so the containers can run side by side (5432 = djvermietungen).
      # Only the host side changes; the container port stays 5432.
      - '5436:5432'
    volumes:
      - beau_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beau -d beau_marketing']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beau_pgdata:
