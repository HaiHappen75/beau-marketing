<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.4 -0.55 24.65 24.65">
  <!-- Geometry of the Check component (src/components/brand/Check.tsx), thicker strokes for 16 px.
       viewBox = bounding box incl. the square cap of the tick. favicon.ico + apple-icon.png: pnpm generate:icons -->
